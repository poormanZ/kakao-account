name: fix-current-lint
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/sourceWithGetSetCookie/sourceWithGetCookie/g' src/index.ts
          rm .github/workflows/fix-current-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/fix-current-lint.yml
          git commit -m 'fix: correct cookie header helper reference'
          git push origin HEAD:main
