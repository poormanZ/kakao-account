name: Production Deploy

on:
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ secrets.PRODUCTION_D1_DATABASE_ID }}
      PRODUCTION_KAKAO_REST_API_KEY: ${{ secrets.PRODUCTION_KAKAO_REST_API_KEY }}
      PRODUCTION_KAKAO_CLIENT_SECRET: ${{ secrets.PRODUCTION_KAKAO_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required}"
          : "${PRODUCTION_D1_DATABASE_ID:?PRODUCTION_D1_DATABASE_ID secret is required}"
          : "${PRODUCTION_KAKAO_REST_API_KEY:?PRODUCTION_KAKAO_REST_API_KEY secret is required}"
          : "${PRODUCTION_KAKAO_CLIENT_SECRET:?PRODUCTION_KAKAO_CLIENT_SECRET secret is required}"

      - name: Generate production secret file
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({KAKAO_REST_API_KEY: process.env.PRODUCTION_KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET: process.env.PRODUCTION_KAKAO_CLIENT_SECRET}))' > production-secrets.json
          echo "Production secret file generated without printing secret values."

      - name: Generate bootstrap Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s#REPLACE_WITH_PRODUCTION_D1_DATABASE_ID#${PRODUCTION_D1_DATABASE_ID}#" \
            -e "s#REPLACE_WITH_PRODUCTION_APP_BASE_URL#https://placeholder.invalid#" \
            -e "s#REPLACE_WITH_PRODUCTION_KAKAO_REDIRECT_URI#https://placeholder.invalid/auth/kakao/callback#" \
            wrangler.production.toml.example > wrangler.production.toml

      - name: Bootstrap production Worker and discover HTTPS URL
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.toml --secrets-file production-secrets.json 2>&1 | tee production-deploy.log
          PRODUCTION_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' production-deploy.log | tail -n 1 || true)"
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "Unable to discover the workers.dev HTTPS URL from Wrangler output."
            exit 1
          fi
          echo "PRODUCTION_APP_BASE_URL=${PRODUCTION_URL}" >> "$GITHUB_ENV"
          echo "PRODUCTION_KAKAO_REDIRECT_URI=${PRODUCTION_URL}/auth/kakao/callback" >> "$GITHUB_ENV"
          echo "Production Worker URL: ${PRODUCTION_URL}"

      - name: Generate final production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s#REPLACE_WITH_PRODUCTION_D1_DATABASE_ID#${PRODUCTION_D1_DATABASE_ID}#" \
            -e "s#REPLACE_WITH_PRODUCTION_APP_BASE_URL#${PRODUCTION_APP_BASE_URL}#" \
            -e "s#REPLACE_WITH_PRODUCTION_KAKAO_REDIRECT_URI#${PRODUCTION_KAKAO_REDIRECT_URI}#" \
            wrangler.production.toml.example > wrangler.production.toml

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply kakao-account-db --remote --config wrangler.production.toml

      - name: Deploy production Worker with final URL and secrets
        run: npx wrangler deploy --config wrangler.production.toml --secrets-file production-secrets.json

      - name: Smoke test production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PRODUCTION_APP_BASE_URL}/health"

      - name: Cleanup temporary production files
        if: always()
        run: rm -f production-secrets.json wrangler.production.toml production-deploy.log
